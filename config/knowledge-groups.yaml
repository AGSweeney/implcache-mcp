# Knowledge groups: trusted families of roots that may be searched together.
# Root names MUST match store rootName values (see list_roots).
groups:
  - id: netburner
    name: NetBurner
    description: NetBurner official docs + examples + related app corpora
    policies:
      allowCrossRootRetrieval: true
      preserveAuthorityRoles: true
      preferCurrentProjectWhenSpecified: true
      preferOfficialDocsForApiDefinitions: true
      preferOfficialExamplesForUsage: true
      includeRelatedProjectsForPatterns: true
      maxRelatedProjects: 3
    members:
      - rootName: NetBurner Examples
        role: official_example
        priority: 100
      - rootName: NetBurner Documents
        role: official_documentation
        priority: 90
      - rootName: NetBurner_MQTT_Broker
