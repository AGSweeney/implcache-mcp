    technology: Example Embedded SDK
    language: cpp
    preferred_roots: [example-device-app, example-device-sdk]
    expected_symbols: [SpiTransfer, ConfigurePin]
    expected_sources:
      - project://example-device-app/drivers/gpio.cpp
      - project://example-device-sdk/spi.md
    max_context_tokens: 2400

  - id: add-mcp-tool
